[package]
name = "lancer-aderyn"
version = "0.1.0"
edition = "2021"
description = "Rust clone of aderyn — Solidity static analyzer, part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-aderyn"
default-run = "lancer-aderyn"

[lib]
name = "lancer_aderyn"
path = "src/lib.rs"

[[bin]]
name = "lancer-aderyn"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive", "cargo", "env"] }
clap_complete = "4.4"

# Serialization / formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Errors / logging
eyre = "0.6"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Analysis engine
rayon = "1.8"
petgraph = "0.6"
regex = "1"
once_cell = "1"
walkdir = "2"
prettytable-rs = "0.10"

# Async runtime (LSP + MCP + GUI worker pool)
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
crossbeam-channel = "0.5"

# LSP
tower-lsp = "0.20"

# Local HTTP (GUI cross-tool bus + MCP http-stream transport)
tiny_http = "0.12"

# GUI (eframe / egui stack — single static binary, no JS)
eframe = { version = "0.29", default-features = true }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
egui_plot = "0.29"
rfd = "0.15"
directories = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
egui-notify = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"
[target.'cfg(target_os = "linux")'.dependencies]
muda = "0.15"
[target.'cfg(target_os = "windows")'.dependencies]
muda = "0.15"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
